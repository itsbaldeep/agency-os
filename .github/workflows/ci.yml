name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  compile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m py_compile scripts/*.py bot/agency_bot.py
      - run: pip install discord.py psycopg2-binary
      - run: python3 -m py_compile bot/agency_bot.py
