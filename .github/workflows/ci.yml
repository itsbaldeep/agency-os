name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  compile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --requirement requirements-ci.txt
      - name: Prepare empty isolated host-path fixtures
        run: |
          sudo mkdir -p /home/agency/.config/agency /home/agency/engagements/trueapply
          sudo chown "$(id -u):$(id -g)" /home/agency/.config/agency /home/agency/engagements/trueapply
          touch /home/agency/.config/agency/core.env
          chmod 600 /home/agency/.config/agency/core.env
      - run: python3 -m py_compile scripts/*.py bot/agency_bot.py
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
